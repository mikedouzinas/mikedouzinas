<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Mike Veson">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#283e80" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#283e80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#ground)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g stroke="#283e80" stroke-width="1" opacity="0.55">
    <line x1="812" y1="76" x2="906" y2="132"/>
    <line x1="906" y1="132" x2="1024" y2="94"/>
    <line x1="906" y1="132" x2="868" y2="228"/>
    <line x1="868" y1="228" x2="988" y2="212"/>
    <line x1="1024" y1="94" x2="1108" y2="168"/>
    <line x1="988" y1="212" x2="1108" y2="168"/>
    <line x1="812" y1="76" x2="868" y2="228"/>
    <line x1="988" y1="212" x2="1024" y2="94"/>
  </g>

  <g fill="#ededed">
    <circle cx="812" cy="76" r="3.5">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="906" cy="132" r="5">
      <animate attributeName="opacity" values="1;0.4;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1024" cy="94" r="3.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="868" cy="228" r="4">
      <animate attributeName="opacity" values="1;0.35;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="988" cy="212" r="3">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1108" cy="168" r="4.5">
      <animate attributeName="opacity" values="1;0.45;1" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="80" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#ededed" letter-spacing="1">Mike Veson</text>
  <text x="84" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#9aa7c7" font-style="italic">technology in the service of human flourishing</text>
  <line x1="84" y1="226" x2="180" y2="226" stroke="#283e80" stroke-width="2"/>
  <text x="84" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#7c8bb0" letter-spacing="2">MIKEVESON.COM</text>
</svg>
